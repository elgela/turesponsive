name: Deploy to DonWeb (SFTP)

on:
  push:
    branches:
      - main

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2

      - name: SFTP Deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: l0013822.ferozo.com       # host SFTP
          username: ${{ secrets.FTP_USER }} # usuario SFTP
          password: ${{ secrets.FTP_PASS }} # contraseña SFTP
          port: 22
          source: "./"                   # carpeta local del repo
          target: "/public_html/"        # carpeta en el servidor

